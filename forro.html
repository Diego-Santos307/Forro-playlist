<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/forro.css"> <!-- link de estilização do layout. -->
    <title>Tocador de Play - Forró</title> <!-- titulo da pagina externa -->
</head>
<body>
    <div class="Music-container">
        <div class="animated-bg">
            <h2 id="tittle-play">Forró</h2> <!-- titulo principal da pg. -->
            <div class="img e song">
                <img id="cover" alt="Disc-cover"> <!-- img -->
                <audio id="audio"></audio> <!-- audio -->

            </div> <!-- container de titulo, img e audio -->

            <div class="Music-container">
                <div id="below-cover">
                    <div class="song-Info">
                        <div id="song-name">name</div> <!-- nome da musica-->
                        <div id="band-name">band</div> <!-- nome da banda -->
                    </div> <!-- container das info. das musica e da banda. -->
                    <button id="like" class="button light-color"><i class="bi bi-hand-thumbs-up"></i></button> <!-- like -->
                </div>
            </div> <!-- informações principais do nome da musica, da banda e o botão de like. -->

            <div class="Music-container">
                <div class="progress-Container">
                    <div id="progress-bar">
                        <div id="currest-progress"></div>
                    </div>
                </div>
            </div> <!-- container do progresso da musica -->

            <div class="Music-container">
                <div id="button-container">
                    <button id="shuffle" class="button"><i class="bi bi-shuffle"></i></button>
                    <button id="previous" class="button button-navegati"><i class="bi bi-skip-start-circle-fill"></i></button>
                    <button id="play" class="button button-biggest"><i class="bi bi-play-circle-fill"></i></button>
                    <button id="next" class="button button-navegati"><i class="bi bi-skip-end-circle-fill"></i></button>
                    <button id="repeat" class="button"><i class="bi bi-repeat"></i></button>
                </div> 
            </div> <!-- container de botãos de fuções da musica -->

            <div class="Music-container">
                <div>

                    <div id="Facebook">
                        <button class="button button-social-media">
                            <i class="bi bi-facebook">
                                <a href="#Facebook"></a>
                            </i>
                        </button>
                    </div> <!-- Facebook -->

                    <div id="Instagram">
                        <button class="button button-social-media">
                            <i class="bi bi-instagram">
                                <a href="#Instagram"></a>
                            </i>
                        </button>
                    </div> <!-- Instagram -->

                    <div id="Youtube">
                        <button class="button button-social-media">
                            <i class="bi bi-youtube">
                                <a href="#Youtube"></a>
                            </i>
                        </button>
                    </div> <!-- Youtube -->

                </div> 
            </div> <!-- container button de redes-sociais -->

            <div id="Rodapé">
                <div>
                    <p>
                        Todos os direitos das músicas e das imagens reservados, aos artistas correspondentes. 
                    </p>
                </div>
            </div>
        </div> <!-- fim do container de animação. um exemplo aplicado. -->
    </div> <!-- container da pg -->


    <script src="forro.js"></script> <!-- adicionado o js ao codigo -->
</body>
</html>
